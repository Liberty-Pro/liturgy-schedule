<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Liturgical Year 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky month navigation over one reading column. Each celebration is a card: feast header, then the five readings, then (if needed) an amber "Awaiting Fr." panel listing the options. */
:root {
  --bg: #f4f3f8;
  --card: #ffffff;
  --line: #dcd9e8;
  --text: #1d1b28;
  --muted: #5d5970;
  --accent: #46388a;
  --accent-soft: #e9e6f7;
  --wait-bg: #fff3d4;
  --wait-line: #d99a2b;
  --wait-text: #7a4700;
  --done-bg: #e3f3e8;
  --done-text: #1f6a3a;
  --head: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131b; --card: #1e1c29; --line: #38344d; --text: #ecebf4; --muted: #a9a5bf;
    --accent: #b9acff; --accent-soft: #2b2745;
    --wait-bg: #3b2d0f; --wait-line: #a77a1f; --wait-text: #f3cd78;
    --done-bg: #17321f; --done-text: #86d4a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14131b; --card: #1e1c29; --line: #38344d; --text: #ecebf4; --muted: #a9a5bf;
  --accent: #b9acff; --accent-soft: #2b2745;
  --wait-bg: #3b2d0f; --wait-line: #a77a1f; --wait-text: #f3cd78;
  --done-bg: #17321f; --done-text: #86d4a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--card); z-index: 30; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }

/* Masthead */
.mast { background: var(--card); border-bottom: 1px solid var(--line); }
.mast .wrap { padding-block: 22px 18px; }
.parish { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
h1 { font-family: var(--head); font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0 0 6px; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }

/* Sticky navigation */
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
nav .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: thin; }
nav a { flex: none; text-decoration: none; color: var(--text); padding: 7px 12px; border-radius: 8px; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; }
nav a:hover { background: var(--accent-soft); }
nav a[aria-current="page"] { background: var(--accent); color: var(--card); }
nav a:focus-visible, .btn:focus-visible, input:focus-visible + .tog, .mcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot-n { font-size: 11px; font-weight: 700; min-width: 20px; padding: 1px 6px; border-radius: 99px; background: var(--wait-bg); color: var(--wait-text); border: 1px solid var(--wait-line); text-align: center; }
nav a[aria-current="page"] .dot-n { background: var(--wait-bg); }
nav .sep { flex: none; width: 1px; background: var(--line); margin: 4px 4px; }

main { padding-block: 22px 60px; }
h2 { font-family: var(--head); font-size: 26px; margin: 0 0 4px; line-height: 1.2; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 18px; max-width: 65ch; }

/* Status banner */
.banner { background: var(--wait-bg); border: 1px solid var(--wait-line); color: var(--wait-text); border-radius: 12px; padding: 16px 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
.banner strong { font-size: 17px; }
.banner p { margin: 2px 0 0; }
.banner .big { font-family: var(--head); font-size: 44px; font-weight: 700; line-height: 1; }
.banner .txt { flex: 1 1 260px; min-width: 0; }
.btn { display: inline-block; background: var(--accent); color: var(--card); text-decoration: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; }

/* Home: month grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 28px; }
.mcard { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: var(--text); min-width: 0; }
.mcard:hover { border-color: var(--accent); }
.mcard .mn { font-family: var(--head); font-size: 20px; font-weight: 600; }
.mcard .mb { color: var(--muted); font-size: 13.5px; flex: 1; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; align-self: flex-start; }
.pill.pend { background: var(--wait-bg); color: var(--wait-text); border: 1px solid var(--wait-line); }
.pill.ok { background: var(--done-bg); color: var(--done-text); border: 1px solid transparent; }

.key { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 14px; }
.key h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.key-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.key p { margin: 0 0 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.sw { display: inline-flex; align-items: center; gap: 6px; }

/* Liturgical color dots */
.cd { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.35); vertical-align: -1px; }
.cd.violet { background: #6c3fb0; } .cd.white { background: #fff; border-color: #8a8699; }
.cd.green { background: #2f8450; } .cd.red { background: #c2271d; }
.cd.rose { background: #f0a1b8; } .cd.black { background: #1b1a1f; border-color: #8a8699; }

/* Month view */
.mhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.tog-l { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; user-select: none; }
.tog-l input { position: absolute; opacity: 0; }
.tog { width: 38px; height: 22px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); transition: transform .15s; }
input:checked + .tog { background: var(--accent); }
input:checked + .tog::after { transform: translateX(16px); }
.cards { display: grid; gap: 14px; }
.cel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cel.has-wait { border-color: var(--wait-line); }
.cel-h { padding: 14px 18px 12px; display: grid; grid-template-columns: 78px 1fr; gap: 4px 14px; align-items: start; }
.date { font-family: var(--head); text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
.date .wd { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-family: var(--body); font-weight: 600; }
.date .dn { font-size: 30px; font-weight: 700; line-height: 1.05; }
.date .mo { font-size: 13px; color: var(--muted); font-family: var(--body); }
.feast { font-family: var(--head); font-size: 19px; font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 4px; font-size: 13.5px; color: var(--muted); }
.note { margin: 6px 0 0; font-size: 14px; }
.rd { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.rd > div { padding: 10px 14px 12px; border-right: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.rd > div:last-child { border-right: 0; }
.rd .l { display: block; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.rd .v { font-weight: 500; font-variant-numeric: tabular-nums; }
.rd .aw { background: var(--wait-bg); box-shadow: inset 0 0 0 1px var(--wait-line); }
.rd .aw .l { color: var(--wait-text); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--wait-text); text-transform: uppercase; }
.rd .aw .v { color: var(--wait-text); font-weight: 400; font-size: 13.5px; }
.rd .aw .v:empty { display: none; }
.special { border-top: 1px solid var(--line); padding: 10px 18px; font-size: 14px; background: var(--accent-soft); }
.special b { font-weight: 600; }
.wait { border-top: 1px solid var(--wait-line); background: var(--wait-bg); color: var(--wait-text); padding: 14px 18px 16px; }
.wait h4 { margin: 0 0 2px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.wait .pn { margin: 4px 0 8px; font-size: 14px; }
.slot { margin-top: 12px; }
.slot .sl { font-weight: 600; font-size: 14.5px; margin-bottom: 4px; }
.slot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.slot li { position: relative; padding-left: 24px; font-size: 14.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.slot li::before { content: ""; position: absolute; left: 2px; top: 4px; width: 12px; height: 12px; border: 2px solid var(--wait-line); border-radius: 50%; }
.slot.multi li::before { border-radius: 3px; }
.empty { padding: 30px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }

/* Awaiting view */
.group { margin-bottom: 28px; }
.group h3 { font-family: var(--head); font-size: 21px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group h3 a { font-family: var(--body); font-size: 13px; font-weight: 500; }
.aw-card { background: var(--card); border: 1px solid var(--wait-line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.aw-card .top { padding: 12px 18px 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.aw-card .top .d { font-weight: 700; font-variant-numeric: tabular-nums; }
.aw-card .top .f { font-family: var(--head); font-size: 17px; font-weight: 600; }
.aw-card .wait { border-top: 0; background: transparent; padding-top: 4px; }

@media (max-width: 900px) {
  .rd { grid-template-columns: 1fr; }
  .rd > div { border-right: 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 9px 16px; }
  .rd > div:last-child { border-bottom: 0; }
  .rd .l { margin: 3px 0 0; }
}
@media (max-width: 520px) {
  .cel-h { grid-template-columns: 56px 1fr; padding-inline: 14px; }
  .date .dn { font-size: 24px; }
  .special, .wait { padding-inline: 14px; }
  .banner .big { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) { .tog, .tog::after { transition: none; } }
</style>
</head>

/* ---------- HELPERS ---------- */
const LABELS = ['1st Reading','Responsorial Psalm','2nd Reading','Acclamation','Gospel'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dparts(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d)); return {wd:WD[dt.getUTCDay()], mo:MO[m-1], d, y, full:`${WD[dt.getUTCDay()]}, ${MO[m-1]} ${d}`}; }
function colorDots(c){ const out=[]; const l=c.toLowerCase(); ['violet','white','green','red','rose','black'].forEach(k=>{ if(l.includes(k)) out.push(`<span class="cd ${k}" aria-hidden="true"></span>`); }); return out.join(''); }
const waitCount = m => m.e.filter(x=>x.sl).length;
const total = MONTHS.reduce((a,m)=>a+m.e.length,0);
const totalWait = MONTHS.reduce((a,m)=>a+waitCount(m),0);

function slotsHtml(x){
  return (x.pn ? `<p class="pn">${esc(x.pn)}</p>` : '') + x.sl.map(([label,opts,multi])=>
    `<div class="slot${multi?' multi':''}"><div class="sl">${esc(label)}</div><ul>${opts.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`).join('');
}
function celHtml(x){
  const p = dparts(x.d), waiting = !!x.sl;
  const readings = LABELS.map((l,i)=>{
    const aw = x.aw && x.aw.includes(i);
    return `<div class="${aw?'aw':''}"><span class="l">${l}</span>` +
      (aw ? `<div class="vv"><span class="tag">Awaiting Fr.</span><div class="v">${esc(x.r[i])}</div></div>` :`<span class="v">${esc(x.r[i])}</span>`) + `</div>`;
  }).join('');
  return `<article class="cel${waiting?' has-wait':''}" id="d-${x.d}-${esc(x.f).length}">
    <div class="cel-h">
      <div class="date"><div class="wd">${p.wd}</div><div class="dn">${p.d}</div><div class="mo">${p.mo}</div></div>
      <div><h3 class="feast">${esc(x.f)}</h3>
        <div class="meta"><span class="sw">${colorDots(x.c)} ${esc(x.c)}</span>${waiting?'<span class="pill pend">Awaiting Fr.&rsquo;s selection</span>':''}</div>
        ${x.n?`<p class="note">${esc(x.n)}</p>`:''}</div>
    </div>
    <div class="rd">${readings}</div>
    ${x.s?`<div class="special">${x.s}</div>`:''}
    ${waiting?`<div class="wait"><h4>Awaiting Fr.&rsquo;s selection</h4>${slotsHtml(x)}</div>`:''}
  </article>`;
}

/* ---------- VIEWS ---------- */
function home(){
  const cards = MONTHS.map(m=>{ const w=waitCount(m);
    return `<a class="mcard" href="#${m.id}"><span class="mn">${m.name}</span><span class="mb">${esc(m.blurb)}</span>
      <span class="pill ${w?'pend':'ok'}">${w?`${w} awaiting Fr.`:'All readings set'}</span></a>`; }).join('');
  return `<h2>Year at a glance</h2>
  <p class="lede">Every Mass for the liturgical year, month by month, with the readings and liturgical color for each. Pick a month above to see its readings.</p>
  <div class="banner"><div class="big">${totalWait}</div><div class="txt"><strong>Masses are waiting on Fr.&rsquo;s reading selections</strong>
    <p>${total-totalWait} of ${total} celebrations have a single set of readings and are final. The other ${totalWait} have options, so the readings for those are not settled yet.</p></div>
    <a class="btn" href="#awaiting">See what is awaiting</a></div>
  <div class="grid">${cards}</div>
  <div class="key"><div class="key-cols">
    <div><h3>How to read this page</h3>
      <p><span class="pill ok">Plain readings</span> are final. Nothing more is needed.</p>
      <p><span class="pill pend">Awaiting Fr.&rsquo;s selection</span> marks a Mass with more than one option. The amber boxes show exactly what is undecided, and the options are listed below the readings.</p></div>
    <div><h3>Liturgical colors</h3><div class="swatches">
      <span class="sw"><span class="cd violet"></span>Violet</span><span class="sw"><span class="cd white"></span>White</span>
      <span class="sw"><span class="cd green"></span>Green</span><span class="sw"><span class="cd red"></span>Red</span>
      <span class="sw"><span class="cd rose"></span>Rose</span><span class="sw"><span class="cd black"></span>Black</span></div></div>
  </div></div>`;
}
function awaiting(){
  const groups = MONTHS.filter(m=>waitCount(m)).map(m=>`<section class="group"><h3>${m.name} <a href="#${m.id}">Open ${m.short}</a></h3>` +
    m.e.filter(x=>x.sl).map(x=>{ const p=dparts(x.d);
      return `<div class="aw-card"><div class="top"><span class="d">${p.full}</span><span class="f">${esc(x.f)}</span></div><div class="wait">${slotsHtml(x)}</div></div>`; }).join('') + `</section>`).join('');
  const clear = MONTHS.filter(m=>!waitCount(m)).map(m=>m.name).join(', ');
  return `<h2>Awaiting Fr.&rsquo;s selections</h2>
  <p class="lede">${totalWait} Masses have more than one reading option. Nothing below is decided yet. Each open circle is a choice for Fr. to make. Where a row says &ldquo;if&rdquo;, it only applies when that earlier option is chosen.</p>
  ${groups}<p class="lede">No selections needed in: ${clear}.</p>`;
}
let onlyWait = false;
function month(m){
  const list = (onlyWait ? m.e.filter(x=>x.sl) : m.e);
  const w = waitCount(m);
  return `<div class="mhead"><div><h2>${m.name}</h2><p class="lede" style="margin:0">${esc(m.blurb)}</p></div>
    ${w?`<label class="tog-l"><input type="checkbox" id="only" ${onlyWait?'checked':''}><span class="tog"></span>Only show Masses awaiting Fr. (${w})</label>`:`<span class="pill ok">All readings set</span>`}</div>
    <div class="cards">${list.length?list.map(celHtml).join(''):'<div class="empty">No Masses in this month are awaiting a selection.</div>'}</div>`;
}

/* ---------- ROUTER ---------- */
function render(){
  const id = location.hash.slice(1) || 'home';
  const m = MONTHS.find(x=>x.id===id);
  const view = $('view');
  view.innerHTML = m ? month(m) : id==='awaiting' ? awaiting() : home();
  const cur = m ? id : (id==='awaiting' ? 'awaiting' : 'home');
  $('nav').innerHTML =
    `<a href="#home" ${cur==='home'?'aria-current="page"':''}>Overview</a>` +
    `<a href="#awaiting" ${cur==='awaiting'?'aria-current="page"':''}>Awaiting Fr. <span class="dot-n">${totalWait}</span></a><span class="sep"></span>` +
    MONTHS.map(x=>{ const w=waitCount(x); return `<a href="#${x.id}" ${cur===x.id?'aria-current="page"':''}>${x.short}${w?` <span class="dot-n" title="${w} awaiting Fr.">${w}</span>`:''}</a>`; }).join('');
  const c = $('only'); if(c) c.addEventListener('change', e=>{ onlyWait = e.target.checked; render(); $('only').focus(); });
  const act = document.querySelector('nav [aria-current]'); if(act) act.scrollIntoView({inline:'center', block:'nearest'});
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });
render();
</script>

</body>
</html>
